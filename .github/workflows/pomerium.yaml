name: Update pomerium (Core)
on:
  repository_dispatch:
    types: [pomerium-release]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create CI token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.POMERIUM_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.POMERIUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.ci-token.outputs.token }}
      - run: ./scripts/pomerium-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.client_payload.version }}
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: "update pomerium formula for version v${{ github.event.client_payload.version }}"
